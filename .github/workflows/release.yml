name: Build Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  packages:
    name: Linux ${{ matrix.arch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: docker.io/library/swift:6.3.3-jammy@sha256:a05aa080e573b1f7e10bd630ce9e1d7645abb08a32d1def73cb611ac708d2a8a
    env:
      GOTOOLCHAIN: local
      POMEFORGE_RELEASE_VERSION: ${{ inputs.version }}
      POMEFORGE_RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.13'
          check-latest: false
          cache: false
      - name: Install Linux packaging tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 rpm dpkg-dev libarchive-tools zstd patchelf liblzma-dev zlib1g-dev ca-certificates git
      - name: Verify native Linux build environment
        run: |
          test "$(uname -s)" = Linux
          test "$(go env GOARCH)" = "$POMEFORGE_RELEASE_ARCH"
          go version
          swift --version
      - name: Test and vet CLI
        run: |
          go test ./...
          go vet ./...
      - name: Build distro packages and portable archive
        run: python3 packaging/release/build.py --version "$POMEFORGE_RELEASE_VERSION" --arch "$POMEFORGE_RELEASE_ARCH" --swift-root / --output-dir "$GITHUB_WORKSPACE/dist"
      - name: Retain release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pomeforge-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  fresh-install:
    name: Fresh ${{ matrix.distro }} / ${{ matrix.arch }}
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, arch: amd64, runner: ubuntu-24.04 }
          - { distro: debian, arch: amd64, runner: ubuntu-24.04 }
          - { distro: debian13, arch: amd64, runner: ubuntu-24.04 }
          - { distro: fedora, arch: amd64, runner: ubuntu-24.04 }
          - { distro: arch, arch: amd64, runner: ubuntu-24.04 }
          - { distro: ubuntu, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: debian, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: debian13, arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: fedora, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      POMEFORGE_RELEASE_VERSION: ${{ inputs.version }}
      POMEFORGE_RELEASE_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pomeforge-linux-${{ matrix.arch }}
          path: dist
      - name: Install into a fresh Linux distribution and prepare the runtime
        run: sh packaging/release/smoke.sh "$POMEFORGE_RELEASE_DISTRO" "$POMEFORGE_RELEASE_VERSION" "$GITHUB_WORKSPACE/dist"
